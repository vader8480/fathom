<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  .h-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px; padding-top: max(6px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border); background: var(--panel); font-size: 12px; color: var(--muted); min-height: 44px; }
  .h-bar b { color: var(--accent); letter-spacing: 1.2px; text-transform: uppercase; font-size: 11px; }
  .h-bar .h-grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px minmax(0, 1fr); }
  #rpal-h-palette { min-height: 0; min-width: 0; border-right: 1px solid var(--border); }
  .h-side { min-height: 0; overflow: auto; padding: 12px 16px; }
  .h-side h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  #rpal-h-log { margin: 0; padding: 0; list-style: none; font: 12px var(--mono); color: var(--muted); }
  #rpal-h-log li { padding: 3px 0; border-bottom: 1px dashed var(--border); }
  @media (max-width: 699px) {
    .h-main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 96px; }
    #rpal-h-palette { border-right: 0; border-bottom: 1px solid var(--border); }
    .h-side { padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  }
</style>
