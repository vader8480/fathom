{{- if and .Values.admin.enabled (not .Values.admin.existingSecret) }}
{{- $name := include "fathom.adminSecretName" . }}
{{- $password := .Values.admin.password }}
{{- $generated := not $password }}
{{- if $generated }}
{{- /* Reuse the password generated at install; `lookup` is empty in `helm template`. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (hasKey (default dict $existing.data) .Values.admin.passwordKey) }}
{{- $password = index $existing.data .Values.admin.passwordKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fathom.labels" . | nindent 4 }}
  {{- /* The user it created lives on in the kept data volume, so its password stays too. */}}
  {{- if and $generated (include "fathom.dataOutlivesRelease" .) }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{ .Values.admin.passwordKey }}: {{ $password | b64enc | quote }}
{{- end }}
