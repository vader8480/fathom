services:
  fathom:
    build:
      context: .
      args:
        WITH_PDF_TOOLS: "true"   # poppler-utils for PDF floor plans ("false" to skip)
        WITH_CHROMIUM: "false"   # "true" adds Chromium for server-side PDF / PNG exports
    image: fathom
    container_name: fathom
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Network discovery (Discovery view) is passive and on demand, but the
    # mDNS / LLDP / ARP probes can only see the AV network from the host's
    # network namespace. To enable them, replace the `ports:` block with
    #   network_mode: host
    # and, for the LLDP / CDP frame listener (raw socket), add
    #   cap_add:
    #     - NET_RAW
    # The UniFi controller probe works through the normal bridged network.
    volumes:
      - fathom-data:/data
    environment:
      # Logins. Either in-memory admins here, or users created with
      #   docker exec -it fathom fathom user add <name> --role editor
      # FATHOM_AUTH: "tech:change-me"
      # Keep the read-only viewer (/p/<project>) and build downloads public while the editor needs a login.
      # FATHOM_PUBLIC_VIEW: "1"
      # Base URL encoded in device QR codes (no trailing slash).
      # FATHOM_PUBLIC_URL: "https://av.example.org"
      FATHOM_MAX_UPLOAD_MB: "50"
      # FATHOM_MAX_JSON_MB: "20"
      # Largest backup zip accepted by Settings › Backups › Upload and restore.
      # FATHOM_MAX_BACKUP_MB: "4096"
      # Optional OpenAI-compatible LLM bridge for assistant notes (the deterministic answer never needs it).
      # FATHOM_LLM_URL: "https://api.openai.com/v1"
      # FATHOM_LLM_MODEL: "gpt-4o-mini"
      # FATHOM_LLM_API_KEY: "sk-..."
      # FATHOM_LLM_TIMEOUT: "20"
      # FATHOM_LLM_MAX_CONTEXT: "24000"
      # Extension directories (importer plugins, equipment templates, assistant checklists).
      # FATHOM_PLUGINS: "/data/plugins"
      # FATHOM_LIBRARY: "/data/library-ext"
      # FATHOM_CHECKLISTS: "/data/checklists"
      # Floor-plan converters: custom PDF rasterizer, ODA File Converter for DWG.
      # FATHOM_PDF_RASTERIZER: "pdftoppm -f {page} -l {page} -r {dpi} -png -singlefile {in} {out}"
      # FATHOM_ODA: "/opt/oda/ODAFileConverter"
      # FATHOM_ODA_XVFB: "1"
      # Network discovery: server-wide UniFi defaults (per-project settings in Discovery › Sources win)
      # and the interface the LLDP listener / mDNS browser bind to.
      # FATHOM_UNIFI_URL: "https://10.0.0.1"
      # FATHOM_UNIFI_SITE: "default"
      # FATHOM_UNIFI_API_KEY: "..."
      # FATHOM_UNIFI_VERIFY_TLS: "0"
      # FATHOM_DISCOVERY_INTERFACE: "eth0"

volumes:
  fathom-data:
