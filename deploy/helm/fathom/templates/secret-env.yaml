{{- if .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fathom.envSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fathom.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name, $value := .Values.secrets.values }}
  {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $name) }}
  {{- fail (printf "secrets.values.%s is not a valid environment variable name" $name) }}
  {{- end }}
  {{ $name }}: {{ toString $value | b64enc | quote }}
  {{- end }}
{{- end }}
