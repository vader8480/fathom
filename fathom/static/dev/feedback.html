<!doctype html>
<html lang="en" data-harness="feedback">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fathom · Feedback harness</title>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/feedback.css">
<style>
  html, body { height: auto; min-height: 100%; }
  body { overflow-x: hidden; }
  .h-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 6px 12px;
    padding-top: max(6px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--panel);
    font-size: 12px; color: var(--muted); min-height: 48px; }
  .h-bar strong { color: var(--text); }
  .h-bar .h-grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #fb-h-bell { font-size: 17px; line-height: 1; min-width: 40px; min-height: 40px; }
  .h-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: 12px; padding: 12px; }
  .h-card { min-width: 0; border: 1px solid var(--border); border-radius: 10px; background: rgba(255,255,255,.015); }
  .h-card > h2 { margin: 0; padding: 8px 12px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border); }
  .h-demo { padding: 10px 12px; min-width: 0; }
  .h-demo + .h-demo { border-top: 1px dashed var(--border); }
  .h-note { margin: 0 0 6px; font-size: 11.5px; color: var(--muted); }
  .h-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .h-row button { min-height: 40px; }
  .h-out { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  @media (pointer: coarse) { .h-row button { min-height: 44px; } }
</style>
</head>
<body>
  <header class="h-bar">
    <strong>Feedback harness</strong>
    <span class="h-grow">skeleton · empty · error · offline · stale · review · confirm · bell</span>
    <button id="fb-h-bell" class="icon ghost" type="button"><span aria-hidden="true">&#x1F514;&#xFE0E;</span><span id="fb-h-bell-count"></span></button>
  </header>
  <main id="fb-h-main" class="h-grid"></main>
  <div id="fathom-live" class="sr-only" aria-live="polite"></div>
  <script type="module" src="feedback-harness.js"></script>
</body>
</html>
