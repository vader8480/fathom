<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Sign in · Fathom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="static/css/app.css">
<style>
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.login form{width:min(360px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px}
.login h1{margin:0 0 4px;font-size:13px;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent)}
.login p{margin:0 0 16px;color:var(--muted)}
.login label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}
.login input{width:100%;font-size:16px;min-height:44px}
.login button{width:100%;margin-top:16px;min-height:44px}
.login .err{color:var(--err);min-height:18px;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<div class="login">
  <form id="login-form" autocomplete="on">
    <h1>Fathom</h1>
    <p>Sign in to your AV documentation.</p>
    <label for="login-user">Username</label>
    <input id="login-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="login-pass">Password</label>
    <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit" id="login-submit">Sign in</button>
    <div class="err" id="login-error" role="alert" aria-live="assertive"></div>
  </form>
</div>
<script type="module" src="static/js/app.js"></script>
</body>
</html>
